name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install shellcheck
      - name: Privacy check
        env:
          PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: |
          if [ -n "$PATTERNS" ]; then printf '%s\n' "$PATTERNS" > .privacy-patterns; fi
          scripts/privacy-check.sh
      - name: Build helpers and fonts
        run: make
      - name: Shellcheck
        run: make check
      - name: Install layout
        run: |
          make install PREFIX="$RUNNER_TEMP/minbar"
          "$RUNNER_TEMP/minbar/bin/minbar" version
          "$RUNNER_TEMP/minbar/bin/minbar" help >/dev/null

  # One macOS runner at a time: three queued together waited out the queue.
  formula:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the formula from this commit
        run: |
          # Homebrew neither taps nor trusts a dependency's tap on its own.
          brew tap felixkratz/formulae
          brew trust --formula felixkratz/formulae/sketchybar
          brew tap-new --no-git minbar/ci
          tap="$(brew --repository minbar/ci)"
          # Homebrew reads the version from the file name.
          version=$(sed -n 's/^MINBAR_VERSION=//p' cli/common.sh)
          tarball="$RUNNER_TEMP/minbar-$version.tar.gz"
          git archive --format=tar.gz --prefix="minbar-$version/" -o "$tarball" HEAD
          sum=$(shasum -a 256 "$tarball" | cut -d' ' -f1)
          sed -e "s|^  url \".*\"|  url \"file://$tarball\"|" \
              -e "s|^  sha256 \".*\"|  sha256 \"$sum\"|" \
              -e '/^  head /d' Formula/minbar.rb > "$tap/Formula/minbar.rb"
          brew style "$tap/Formula/minbar.rb"
          brew install --build-from-source minbar/ci/minbar
          brew test minbar/ci/minbar

  nix:
    needs: formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - run: nix flake check -L
